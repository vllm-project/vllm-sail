schema_version: ppu-serving/v1
ppu:
  framework: vllm
  visibility: public
  upstream_schema: vllm-project/recipes@b08ad738
  assets:
    model: deepseek-v4-mxfp4
    tokenizer: deepseek-v4-mxfp4
  hf_model_id: T-HEAD/DeepSeek-V4-Flash-0731-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
  golden_model_key: deepseek_v4_mxfp4
  served_name: deepseek-v4-mxfp4
  topology:
    kind: single_node
    nodes: 1
    devices_per_node: 8
  default_features: []
  external_env: []
model:
  model_id: deepseek-ai/DeepSeek-V4-Flash
  base_args:
    - --tensor-parallel-size
    - "8"
    - --gpu-memory-utilization
    - "0.9"
    - --max-model-len
    - "16384"
    - --trust-remote-code
    - --seed
    - "0"
  base_env: {}
features:
  tool_calling:
    args:
      - --enable-auto-tool-choice
      - --tool-call-parser
      - deepseek_v4
  reasoning:
    args:
      - --tokenizer-mode
      - deepseek_v4
      - --reasoning-parser
      - deepseek_v4
      - --reasoning-config
      - '{"reasoning_parser": "deepseek_v4", "reasoning_start_str": "", "reasoning_end_str": ""}'
  spec_decoding:
    default_mode: dspark
    modes:
      dspark:
        args:
          - --speculative-config
          - '{"method": "dspark", "num_speculative_tokens": 7, "draft_sample_method": "probabilistic"}'
variants:
  default:
    precision: mxfp4
    hardware: zhenwu_m890
    assets:
      model: deepseek-v4-mxfp4
      tokenizer: deepseek-v4-mxfp4
    hf_model_id: T-HEAD/DeepSeek-V4-Flash-0731-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
    golden_model_key: deepseek_v4_mxfp4
    served_name: deepseek-v4-mxfp4
    extra_args: []
    extra_env: {}
  w8a8_int8:
    precision: w8a8_int8
    hardware: zhenwu_810e
    assets:
      model: deepseek-v4-int8
      tokenizer: deepseek-v4-int8
    hf_model_id: T-HEAD/DeepSeek-V4-Flash-0731-W8A8-INT8
    golden_model_key: deepseek_v4_int8
    served_name: deepseek-v4-int8
    extra_args: []
    extra_env: {}
hardware_overrides:
  zhenwu_m890:
    extra_args: []
    extra_env: {}
presets:
  prefill: &single_node_prefill
    select:
      features:
        spec_decoding: false
    args: []
  decode: &single_node_decode
    remove_args:
      - --tensor-parallel-size
      - --seed
    select:
      features:
        tool_calling: true
        reasoning: true
        spec_decoding: true
    args:
      - --data-parallel-size
      - "8"
      - --enable-expert-parallel
      - --all2all-backend
      - deepep_low_latency
      - --max-num-batched-tokens
      - "1024"
      - --max-num-seqs
      - "128"
      - --kv-cache-dtype
      - fp8
      - --block-size
      - "256"
      - --distributed-timeout-seconds
      - "3600"
      - --cpu-distributed-timeout-seconds
      - "3600"
      - --compilation-config
      - '{"cudagraph_mode": "FULL_DECODE_ONLY", "custom_ops": ["all"]}'
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: "6000"
  # Existing callers keep the M890 preset names and policy digests.
  dp_ep_low_latency:
    <<: *single_node_decode
    hardware: zhenwu_m890
  prefill_long:
    <<: *single_node_prefill
    hardware: zhenwu_m890
  eval_longctx:
    hardware: zhenwu_m890
    args: []
notes: >-
  The M890 MXFP4 baseline and dp_ep_low_latency preset back the existing TP8
  and single-node DP8+EP policies. The prefill and decode slots expose the TP8
  path without speculative decoding and the DP8+EP path with DSpark. The
  810E W8A8 INT8 variant follows the existing eight-card legacy layouts and
  is catalog-only. Multi-node EP and disaggregated PD require separate
  model-specific validation.
