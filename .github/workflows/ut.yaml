name: CPU unit tests

on:
  workflow_call:
    inputs:
      pr_head_sha:
        description: Exact PR head SHA under test
        type: string
        default: ""
      pr_number:
        description: PR number for coverage attribution
        type: string
        default: ""
      pr_head_ref:
        description: PR head branch for coverage attribution
        type: string
        default: ""
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ut-${{ inputs.pr_head_sha && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-unit-tests:
    name: CPU UT (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU-only test tooling
        run: python -m pip install --no-cache-dir -r requirements/dev.txt
      - name: Require CPU test toolchain
        run: |
          python - <<'PY'
          import subprocess

          for tool in ("cmake", "c++"):
              subprocess.run([tool, "--version"], check=True)
          version = subprocess.check_output(["cmake", "--version"], text=True).split()[2]
          assert tuple(map(int, version.split(".")[:2])) >= (3, 26), version
          PY
      - name: Run bare CPU unit tests
        run: >-
          python -m pytest tests/ut -q -rs
          -m "not upstream_source and not requires_runtime and not ppu and not cap80 and not cap89"
          --cov=vllm_sail --cov-branch --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          override_commit: ${{ inputs.pr_head_sha || github.sha }}
          override_branch: ${{ inputs.pr_head_ref || github.ref_name }}
          override_pr: ${{ inputs.pr_number }}
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
