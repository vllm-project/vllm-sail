name: Unit tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ut-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-control-tests:
    name: CI control contracts (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    cache-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate preview control tools without device dependencies
        run: |
          python3 -B -m unittest discover -s tests -p 'test_nightly_assets.py' -q
          python3 -B -m unittest discover -s tests -p 'test_deployment.py' -q
          python3 -B -m unittest discover -s tests -p 'test_verify_installed.py' -q
          python3 -B -m unittest discover -s tests -p 'test_workflow_contracts.py' -q
          python3 -B scripts/ci/deployment.py validate-test-source --source .
          bash -n scripts/ci/run_existing_tests.sh
          bash -n scripts/ci/ppu_smoke.sh

  cpu-unit-tests:
    name: CPU UT (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only test tooling
        run: python -m pip install -r requirements/dev.txt
      - name: Run unit tests without vLLM, torch, or hardware
        run: >-
          python -m pytest tests/ut -q
          --cov=vllm_sail --cov-branch --cov-report=term-missing
          --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false

  vllm-source-contracts:
    name: vLLM source (main-verified)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the selected upstream ref
        id: upstream
        run: |
          pin="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"
          [[ "${pin}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid upstream ref: ${pin}"; exit 1; }
          echo "ref=${pin}" >> "$GITHUB_OUTPUT"
      - name: Check out upstream source without installing vLLM
        uses: actions/checkout@v4
        with:
          repository: vllm-project/vllm
          ref: ${{ steps.upstream.outputs.ref }}
          path: .upstream/vllm
          persist-credentials: false
      - name: Record the tested upstream revision
        run: git -C .upstream/vllm rev-parse HEAD
      - name: Purge pip cache (prevent cache-poisoning vector)
        run: rm -rf ~/.cache/pip
      - name: Install CPU-only test tooling
        run: python -m pip install --no-cache-dir -r requirements/dev.txt
      - name: Check feature contracts against the selected source
        env:
          VLLM_SOURCE_ROOT: ${{ github.workspace }}/.upstream/vllm
        run: >-
          python -m pytest tests/ut -q -rs
          -m upstream_source --require-upstream-source
