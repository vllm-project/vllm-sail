name: Verify candidate PPU PR CI
run-name: "Candidate CI (main) at efcd42562dbbecf0a0d2ede517e3d28ce3164555"

on:
  workflow_dispatch:

permissions: {}
cache-mode: none

jobs:
  cpu:
    if: >-
      github.repository == 'vllm-project/vllm-sail' &&
      github.ref == 'refs/heads/codex/ci-image-validation-main-20261124' &&
      github.actor == 'Yunzshi310'
    permissions:
      contents: read
    uses: ./.github/workflows/ut.yaml
    with:
      pr_head_sha: 'efcd42562dbbecf0a0d2ede517e3d28ce3164555'

  ppu:
    if: >-
      github.repository == 'vllm-project/vllm-sail' &&
      github.ref == 'refs/heads/codex/ci-image-validation-main-20261124' &&
      github.actor == 'Yunzshi310'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ppu-build-and-test.yaml
    secrets:
      ci_registry_username: ${{ secrets.RELEASE_USERNAME }}
      ci_registry_token: ${{ secrets.RELEASE_TOKEN }}
    with:
      pr_head_sha: 'efcd42562dbbecf0a0d2ede517e3d28ce3164555'
