name: PPU runtime registry access validation

on:
  workflow_dispatch:

permissions: {}

env:
  PROBE_IMAGE: download.t-head.cn/docker_test/vllm:v0.33.0-20261123-c550c70

jobs:
  manifest:
    if: >-
      github.repository == 'vllm-project/vllm-sail' &&
      github.ref == 'refs/heads/codex/hosted-registry-check-20261124' &&
      github.actor == 'Yunzshi310'
    runs-on: 8-ppu-m890p
    timeout-minutes: 3
    steps:
      - name: Check the existing runner registry access
        shell: bash
        run: |
          if docker image inspect "$PROBE_IMAGE" >/dev/null 2>&1; then
            echo "Requested runtime image is already cached"
            exit 0
          fi
          if timeout 40s docker manifest inspect "$PROBE_IMAGE" >/dev/null 2>&1; then
            echo "Runner Docker context can read the runtime manifest"
          else
            echo "::error::Runner Docker context could not read the runtime manifest"
            exit 1
          fi
