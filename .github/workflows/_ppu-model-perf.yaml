name: PPU model performance

on:
  workflow_call:
    inputs:
      pr_head_sha:
        description: Exact SAIL commit under test
        required: true
        type: string
      wheel_source_sha:
        description: Exact SAIL commit recorded in the wheel manifest
        required: true
        type: string
      build_run_id:
        description: PPU CI build run supplying ppu-wheels-<run_id>
        required: true
        type: string
      model_path:
        description: Local checkpoint directory (blank = offline HF cache)
        type: string
        default: ""
      model_revision:
        description: Immutable model revision (required with explicit model_path)
        type: string
        default: ""
      hf_home:
        description: Host Hugging Face cache root
        type: string
        default: /nas_aisw/datasets/hf_cache
      dg_cache_dir:
        description: Host root for the DeepGEMM JIT kernel cache
        type: string
        default: /nas_aisw/vllmci_dgcache

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  model-perf:
    name: Model Perf (M890, DP8+EP)
    runs-on: 8-ppu-m890p
    timeout-minutes: 150
    env:
      GIT_CONFIG_NOSYSTEM: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare private runtime directories and Git configuration
        id: runtime
        run: |
          config="$(mktemp "${RUNNER_TEMP}/git-config.XXXXXX")"
          wheels="$(mktemp -d "${RUNNER_TEMP}/ppu-model-perf-wheels.XXXXXX")"
          artifacts="$(mktemp -d "${RUNNER_TEMP}/ppu-model-perf-artifacts.XXXXXX")"
          source_rel=".ppu-model-perf-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source="${GITHUB_WORKSPACE}/${source_rel}"
          {
            printf 'GIT_CONFIG_GLOBAL=%s\n' "$config"
            printf 'wheels=%s\n' "$wheels"
            printf 'artifacts=%s\n' "$artifacts"
            printf 'source_rel=%s\n' "$source_rel"
            printf 'source=%s\n' "$source"
          } >> "$GITHUB_OUTPUT"
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$config" >> "$GITHUB_ENV"

      - name: Require disabled cache access
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.ACTIONS_CACHE_MODE !== 'none') {
              core.setFailed('PPU CI requires cache-mode: none');
            }

      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          github-server-url: https://github.com
          ref: ${{ inputs.pr_head_sha }}
          path: ${{ steps.runtime.outputs.source_rel }}
          persist-credentials: false

      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ inputs.pr_head_sha }}
          SOURCE_DIR: ${{ steps.runtime.outputs.source }}
        run: test "$(git -c safe.directory="$SOURCE_DIR" -C "$SOURCE_DIR" rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Download CI-built wheels
        uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ inputs.build_run_id }}
          path: ${{ steps.runtime.outputs.wheels }}
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Run model forward performance in the preloaded runtime
        env:
          PPU_CI_SOURCE_DIR: ${{ steps.runtime.outputs.source }}
          PPU_CI_SOURCE_SHA: ${{ inputs.pr_head_sha }}
          PPU_CI_WHEELS_DIR: ${{ steps.runtime.outputs.wheels }}
          PPU_CI_ARTIFACT_DIR: ${{ steps.runtime.outputs.artifacts }}
          PPU_CI_DEVICE_COUNT: "8"
          PPU_CI_REQUIRE_PR_ARTIFACT: "false"
          PPU_CI_WHEEL_SOURCE_SHA: ${{ inputs.wheel_source_sha }}
          PPU_CI_HF_HOME: ${{ inputs.hf_home }}
          PPU_CI_DG_CACHE_DIR: ${{ inputs.dg_cache_dir }}
          HF_HUB_OFFLINE: "1"
          MODEL_ID: T-HEAD/DeepSeek-V4-Flash-0731-MoE-Quant-W-MXFP4-A-MXFP4-Dense-Quant-W-FP8-PerChannel-A-FP8-PerToken
          MODEL_PATH: ${{ inputs.model_path }}
          MODEL_REVISION: ${{ inputs.model_revision }}
        run: bash "${PPU_CI_SOURCE_DIR}/scripts/ci/ppu_runtime_container.sh" model-perf

      - name: Publish model performance summary
        if: always()
        env:
          PPU_CI_ARTIFACT_DIR: ${{ steps.runtime.outputs.artifacts }}
        run: |
          if [[ -f "${PPU_CI_ARTIFACT_DIR}/perf-summary.md" ]]; then
            cat "${PPU_CI_ARTIFACT_DIR}/perf-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload model performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-model-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.runtime.outputs.artifacts }}/**
            ${{ steps.runtime.outputs.wheels }}/wheel-manifest.json
          if-no-files-found: warn
          retention-days: 30
