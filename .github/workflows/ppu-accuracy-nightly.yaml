name: PPU accuracy nightly

on:
  workflow_dispatch:
    inputs:
      models:
        description: Recipe policy slugs for this validation
        type: string
        required: true

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  build:
    name: Repackage verified native wheels
    if: ${{ inputs.models == 'recipe:deepseek-v4-flash-dp-ep' }}
    uses: ./.github/workflows/_ppu-build.yaml
    with:
      pr_head_sha: '51cbbdf1c5bc35cbb0e36e1c302cb6dd66464044'
      native_reuse_run_id: '44504802787'

  recipe-model-sanity:
    name: Recipe model sanity & micro-E2E
    needs: build
    if: ${{ needs.build.result == 'success' && inputs.models == 'recipe:deepseek-v4-flash-dp-ep' }}
    uses: ./.github/workflows/_ppu-recipe-model-sanity.yaml
    with:
      pr_mode: false
      pr_head_sha: '51cbbdf1c5bc35cbb0e36e1c302cb6dd66464044'
      wheel_source_sha: '51cbbdf1c5bc35cbb0e36e1c302cb6dd66464044'
      build_run_id: ${{ github.run_id }}
      models: 'deepseek-v4-flash-dp-ep'
