name: PPU accuracy nightly

on:
  workflow_dispatch:
    inputs:
      models:
        description: Recipe policy slugs for this validation
        type: string
        required: true

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  recipe-model-sanity:
    name: Recipe model sanity & micro-E2E
    if: ${{ inputs.models == 'recipe:deepseek-v4-flash-dp-ep' }}
    uses: ./.github/workflows/_ppu-recipe-model-sanity.yaml
    with:
      pr_mode: false
      pr_head_sha: 'daa3bd67129c7af0ae271622ec619edf7171cd87'
      wheel_source_sha: 'daa3bd67129c7af0ae271622ec619edf7171cd87'
      build_run_id: '44660448842'
      models: 'deepseek-v4-flash-dp-ep'
