name: PPU accuracy nightly

on:
  workflow_dispatch:
    inputs:
      models:
        description: Recipe policy slugs for this validation
        type: string
        required: true

permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  recipe-model-sanity:
    name: Recipe model sanity & micro-E2E
    if: ${{ inputs.models == 'recipe:deepseek-v4-flash-dp-ep,qwen3.8-flash-next-dp-ep' }}
    uses: ./.github/workflows/_ppu-recipe-model-sanity.yaml
    with:
      pr_mode: false
      pr_head_sha: '743ba401a9e3f563418ed44eff97157410e91353'
      wheel_source_sha: '807b4528a515f42ce3aa1eb9f37935f45152276d'
      build_run_id: '44504802787'
      models: 'deepseek-v4-flash-dp-ep,qwen3.8-flash-next-dp-ep'
