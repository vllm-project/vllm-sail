name: Dockerfile CI
# PR events run hosted static checks only. Persistent PPU runners are manual-only.
on:
  pull_request:
    branches: [main]
    paths:
      - 'docker/**'
      - '.github/workflows/dockerfile-ci.yaml'
      - '.github/workflows/nightly-tests.yaml'
      - '.github/workflows/promote-nightly.yaml'
      - '.github/workflows/ut.yaml'
      - '.github/workflows/release.yaml'
      - '.github/ci/tests/catalog.json'
      - '.github/vllm-main-verified.commit'
      - 'scripts/ci/**'
      - 'tests/test_deployment.py'
      - 'tests/test_nightly_assets.py'
      - 'tests/test_verify_installed.py'
      - 'tests/test_workflow_contracts.py'
      - 'tests/ut/test_patch_install.py'
      - 'tests/ut/test_packaging.py'
      - 'tests/e2e/test_native_activation.py'
      - 'tests/support/ppu_ci.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repository PR authored by a repository writer'
        type: string
        required: true
      approve_host_execution:
        description: 'I reviewed this PR and approve execution on persistent PPU hosts'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
cache-mode: none
concurrency:
  group: dockerfile-ci-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true
jobs:
  static:
    name: dockerfile-static
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check control tools without internal secrets or PPU allocation
        run: |
          python3 -B -m unittest discover -s tests -p 'test_nightly_assets.py' -q
          python3 -B -m unittest discover -s tests -p 'test_deployment.py' -q
          python3 -B -m unittest discover -s tests -p 'test_verify_installed.py' -q
          python3 -B -m unittest discover -s tests -p 'test_workflow_contracts.py' -q
          bash -n scripts/ci/ppu_smoke.sh
          bash -n scripts/ci/run_existing_tests.sh
      - name: Explain separate hardware status
        run: |
          echo 'Static checks do not certify Docker build or PPU execution.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A maintainer must trigger the default-branch manual workflow for dockerfile-ppu.' >> "$GITHUB_STEP_SUMMARY"
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
      actions: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require explicit persistent-host opt-in
        env:
          PPU_TRANSITION_ENABLED: ${{ vars.PPU_TRANSITION_ENABLED }}
          TRUSTED_PPU_TESTS_ENABLED: ${{ vars.TRUSTED_PPU_TESTS_ENABLED }}
          APPROVE_HOST_EXECUTION: ${{ inputs.approve_host_execution }}
          PREVIEW_REGISTRY_HOST: ${{ vars.PREVIEW_REGISTRY_HOST }}
          PREVIEW_IMAGE_REPOSITORY: ${{ vars.PREVIEW_IMAGE_REPOSITORY }}
          RUNTIME_BASE_IMAGE: ${{ vars.RUNTIME_BASE_IMAGE }}
        run: |
          python3 control/scripts/ci/deployment.py preflight --mode dockerfile \
            --catalog control/.github/ci/tests/catalog.json \
            --output "flow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/plan.json"
      - name: Authorize actor, author and exact PR snapshot via API
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          CONSUMER: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python3 control/scripts/ci/deployment.py authorize-pr \
            --repository "$CONSUMER" --pr-number "$PR_NUMBER" \
            --output "flow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/pr.json"
      - name: Mark the exact head as awaiting device verification
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          HEAD_SHA: ${{ steps.authorize.outputs.head_sha }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA, state: 'pending',
              context: 'dockerfile-ppu', description: 'Awaiting approved build and PPU smoke',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
      - name: Download passed preview wheels, not a stable verified baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CONSUMER: ${{ github.repository }}
        run: |
          python3 control/scripts/ci/nightly_assets.py fetch-preview \
            --consumer-repository "$CONSUMER" \
            --output "flow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockerfile-ci-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            flow-${{ github.run_id }}-${{ github.run_attempt }}/plan.json
            flow-${{ github.run_id }}-${{ github.run_attempt }}/pr.json
            flow-${{ github.run_id }}-${{ github.run_attempt }}/selection.json
            flow-${{ github.run_id }}-${{ github.run_attempt }}/baseline.json
            flow-${{ github.run_id }}-${{ github.run_attempt }}/wheelhouse/
          if-no-files-found: error
          retention-days: 14
  build-smoke:
    needs: resolve
    environment: dockerfile-ci
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: [self-hosted, Linux, X64, 8-ppu-m890p]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dockerfile-ci-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: flow-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Invalidate stale approvals before checking out the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          CONSUMER: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: |
          python3 control/scripts/ci/deployment.py verify-pr --repository "$CONSUMER" \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          path: proposal
          persist-credentials: false
      - name: Prepare the actual reviewed Dockerfile
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          test "$(git -C proposal rev-parse HEAD)" = "$HEAD_SHA"
          test -f proposal/docker/Dockerfile.ci
          python3 - <<'PY'
          from pathlib import Path
          root = Path('proposal/docker')
          assert root.is_dir() and not root.is_symlink(), 'The Docker directory must be a real directory'
          assert not any(p.is_symlink() for p in root.rglob('*')), 'Symlinks in Docker context are forbidden'
          PY
          flow="flow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$flow/context"
          cp -R proposal/docker "$flow/context/docker"
          cp -R "$flow/wheelhouse" "$flow/context/wheelhouse"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.PREVIEW_REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_PULL_USER }}
          password: ${{ secrets.REGISTRY_PULL_TOKEN }}
      - name: Build reviewed Dockerfile without image publication
        env:
          BASE_IMAGE: ${{ vars.RUNTIME_BASE_IMAGE }}
        run: |
          set -Eeuo pipefail
          flow="flow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker pull "$BASE_IMAGE"
          docker build --pull=false --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            -f "$flow/context/docker/Dockerfile.ci" \
            -t "sail-dockerfile-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$flow/context"
      - name: Verify installed bytes, imports and a real PPU operator
        env:
          TEST_IMAGE: sail-dockerfile-ci:${{ github.run_id }}-${{ github.run_attempt }}
          WHEELS_DIR: ${{ github.workspace }}/flow-${{ github.run_id }}-${{ github.run_attempt }}/wheelhouse
          RESULTS_DIR: ${{ github.workspace }}/flow-${{ github.run_id }}-${{ github.run_attempt }}/results
        run: bash control/scripts/ci/ppu_smoke.sh
      - name: Preserve smoke evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockerfile-ci-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            flow-${{ github.run_id }}-${{ github.run_attempt }}/pr.json
            flow-${{ github.run_id }}-${{ github.run_attempt }}/results/
          if-no-files-found: warn
          retention-days: 14
  report:
    needs: [resolve, build-smoke]
    if: always() && github.event_name == 'workflow_dispatch' && needs.resolve.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          DEVICE_RESULT: ${{ needs.build-smoke.result }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR_NUMBER)});
            const fresh = pr.state === 'open' && pr.head.sha === process.env.HEAD_SHA && pr.base.sha === process.env.BASE_SHA;
            const passed = fresh && process.env.RESOLVE_RESULT === 'success' && process.env.DEVICE_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA, state: passed ? 'success' : 'failure',
              context: 'dockerfile-ppu', description: passed ? 'Reviewed Dockerfile build and PPU smoke passed' : 'Missing, failed, cancelled, or stale device verification',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            if (!passed) core.setFailed('Device verification did not pass for the current PR snapshot');
