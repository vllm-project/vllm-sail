  rc-ops-select:
    name: RC PPU operator test selection
    needs: [route, build, cpu-fast-check]
    if: >-
      needs.route.outputs.selected_gear == 'rc_qualify' &&
      needs.route.outputs.target_sha != '' &&
      inputs.ops_image != '' &&
      needs.build.result == 'success' &&
      needs.cpu-fast-check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_tests: ${{ steps.select.outputs.has_tests }}
      runtime_image: ${{ steps.select.outputs.runtime_image }}
      selection_artifact: ${{ steps.select.outputs.selection_artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ppu-wheels-${{ github.run_id }}
          path: ops-wheels
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: ppu-build-diagnostics-${{ github.run_id }}
          path: ops-build-diagnostics
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}

      - name: Generate full RC operator test selection
        id: select
        env:
          BUILD_IMAGE: ${{ needs.build.outputs.image }}
          OPS_IMAGE_OVERRIDE: ${{ inputs.ops_image }}
          EXPECTED_VLLM_COMMIT: ${{ needs.route.outputs.target_sha }}
        run: |
          mkdir -p ops-selection
          RUNTIME_IMAGE="$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.ci.ppu_ops_select import (
              collect_changes,
              digest_image,
              github_outputs,
              validate_config,
              validate_environment,
              write_json,
          )
          root = Path.cwd()
          env_cfg = json.loads((root / "scripts/ci/ppu_ops_environment.json").read_bytes())
          validate_config(json.loads((root / "scripts/ci/ppu_ops_tests.json").read_bytes()), root)
          validate_environment(env_cfg)
          runtime = digest_image(os.environ["OPS_IMAGE_OVERRIDE"])
          github_outputs({"runtime_image": runtime})
          write_json("ops-selection/changes.json", collect_changes(root, None, None, os.environ["GITHUB_SHA"]))
          print(runtime)
          PY
          )"
          cp scripts/ci/ppu_ops_tests.json scripts/ci/ppu_ops_environment.json ops-selection/
          python3 scripts/ci/ppu_ops_select.py select --repo . \
            --config ops-selection/ppu_ops_tests.json \
            --environment ops-selection/ppu_ops_environment.json \
            --changes ops-selection/changes.json \
            --build-manifest ops-build-diagnostics/build-manifest.txt \
            --wheel-manifest ops-wheels/wheel-manifest.json \
            --build-run-id "${GITHUB_RUN_ID}" \
            --build-image "${BUILD_IMAGE}" \
            --runtime-image "${RUNTIME_IMAGE}" \
            --expected-vllm-commit "${EXPECTED_VLLM_COMMIT}" \
            --scope full \
            --output ops-selection/selection.json
          printf 'selection_artifact=ppu-ops-selection-%s-%s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.select.outputs.selection_artifact }}
          path: ops-selection/
          if-no-files-found: error
          retention-days: 14

  rc-ops-tests:
    name: RC PPU operator qualification
    needs: [route, build, rc-ops-select]
    if: >-
      needs.route.outputs.selected_gear == 'rc_qualify' &&
      needs.rc-ops-select.result == 'success' &&
      needs.rc-ops-select.outputs.has_tests == 'true'
    uses: ./.github/workflows/_ppu-ops-tests.yaml
    permissions:
      contents: read
      actions: read
    with:
      build_run_id: ${{ github.run_id }}
      matrix: ${{ needs.rc-ops-select.outputs.matrix }}
      selection_artifact: ${{ needs.rc-ops-select.outputs.selection_artifact }}
      build_image: ${{ needs.build.outputs.image }}
      expected_vllm_commit: ${{ needs.route.outputs.target_sha }}
      image: ${{ needs.rc-ops-select.outputs.runtime_image }}

  daily-pin-bump:
    name: Open or update daily verified-pin PR
    needs: route
    if: >-
      needs.route.outputs.selected_gear == 'daily_pin_bump' &&
      needs.route.outputs.target_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Check out latest vLLM SAIL main branch
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Revalidate live cursor and prepare verified pin bump metadata
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          OVERRIDE_REF: ${{ inputs.upstream_ref || '' }}
        run: |
          set -euo pipefail
          sail_main_sha="$(git rev-parse HEAD)"
          printf 'sail_main_sha=%s\n' "${sail_main_sha}" >> "$GITHUB_OUTPUT"

          mkdir -p /tmp/daily-cursor
          best_meta="$(python3 - <<'PY'
          import json, os, time, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          cur_run = int(os.environ.get("CURRENT_RUN_ID") or "0")
          cur_attempt = int(os.environ.get("CURRENT_RUN_ATTEMPT") or "1")

          def api_get(path: str) -> dict:
              url = f"https://api.github.com/repos/{repo}/{path}"
              last_err = None
              for attempt in range(1, 4):
                  req = urllib.request.Request(
                      url,
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except Exception as exc:
                      last_err = exc
                      if attempt < 3:
                          time.sleep(0.2 * attempt)
              raise RuntimeError(f"GitHub API {path} failed: {last_err}")

          def is_better(cand: dict, best: dict | None) -> bool:
              if best is None:
                  return True
              if cand["run_id"] == best["run_id"] and cand["attempt"] != best["attempt"]:
                  return cand["attempt"] > best["attempt"]
              if cand["created_at"] != best["created_at"]:
                  return cand["created_at"] > best["created_at"]
              if cand["id"] != best["id"]:
                  return cand["id"] > best["id"]
              if cand["run_id"] != best["run_id"]:
                  return cand["run_id"] > best["run_id"]
              return cand["attempt"] > best["attempt"]

          best = None
          for status in ("in_progress", "completed"):
              page = 1
              while True:
                  data = api_get(
                      f"actions/workflows/upstream-canary.yaml/runs?branch=main&status={status}&per_page=100&page={page}"
                  )
                  runs = data.get("workflow_runs") or []
                  if not runs:
                      break
                  for run in runs:
                      rid = int(run.get("id") or 0)
                      if not rid:
                          continue
                      if status == "in_progress" and rid != cur_run:
                          continue
                      if status == "completed" and rid == cur_run:
                          continue
                      art_page = 1
                      while True:
                          adata = api_get(f"actions/runs/{rid}/artifacts?per_page=100&page={art_page}")
                          arts = adata.get("artifacts") or []
                          for art in arts:
                              name = str(art.get("name") or "")
                              if art.get("expired") or not name.startswith("upstream-post-merge-cursor-"):
                                  continue
                              suffix = name.rsplit("-", 1)[-1]
                              att = int(suffix) if suffix.isdigit() else 0
                              if rid == cur_run and cur_attempt > 0 and att >= cur_attempt:
                                  continue
                              cand = {
                                  "run_id": rid,
                                  "name": name,
                                  "id": int(art.get("id") or 0),
                                  "attempt": att,
                                  "created_at": str(art.get("created_at") or ""),
                              }
                              if is_better(cand, best):
                                  best = cand
                          if len(arts) < 100:
                              break
                          art_page += 1
                  if status == "in_progress" or len(runs) < 100:
                      break
                  page += 1

          print(json.dumps(best or {}))
          PY
          )"

          best_run_id="$(printf '%s' "${best_meta}" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("run_id", ""))')"
          best_art_name="$(printf '%s' "${best_meta}" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("name", ""))')"
          cursor_args=()
          if [[ -n "${best_run_id}" && -n "${best_art_name}" ]]; then
            gh run download "${best_run_id}" -R "${GITHUB_REPOSITORY}" -n "${best_art_name}" -D /tmp/daily-cursor
            if [[ ! -f /tmp/daily-cursor/cursor.json ]]; then
              echo "downloaded ${best_art_name} from run ${best_run_id} without cursor.json" >&2
              exit 1
            fi
            cursor_args=(--cursor-file /tmp/daily-cursor/cursor.json)
          fi

          git ls-remote https://github.com/vllm-project/vllm.git refs/heads/main "refs/heads/releases/v*" "refs/tags/v*" > /tmp/daily-ls-remote.txt
          head_main_sha="$(awk '$2 == "refs/heads/main" { print $1 }' /tmp/daily-ls-remote.txt)"
          verified="$(tr -d '[:space:]' < .github/vllm-main-verified.commit)"

          rm -rf /tmp/vllm-pin-ancestry
          git init -q /tmp/vllm-pin-ancestry
          git -C /tmp/vllm-pin-ancestry remote add origin https://github.com/vllm-project/vllm.git
          if [[ -n "${head_main_sha}" ]]; then
            git -C /tmp/vllm-pin-ancestry fetch --quiet --depth=250 origin "+refs/heads/main:refs/remotes/origin/main"
          fi
          if [[ -n "${OVERRIDE_REF}" && "${OVERRIDE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            git -C /tmp/vllm-pin-ancestry fetch --quiet --depth=250 origin "${OVERRIDE_REF}" || true
          fi
          if ! git -C /tmp/vllm-pin-ancestry cat-file -e "${verified}^{commit}" 2>/dev/null; then
            git -C /tmp/vllm-pin-ancestry fetch --quiet --depth=1 origin "${verified}" || true
          fi

          target_args=()
          if [[ "${OVERRIDE_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            target_args=(--target-sha "${OVERRIDE_REF}")
          fi

          python3 scripts/ci/ppu_upstream_post_merge.py prepare-pin-bump \
            "${target_args[@]}" \
            "${cursor_args[@]}" \
            --ls-remote-file /tmp/daily-ls-remote.txt \
            --vllm-repo /tmp/vllm-pin-ancestry \
            --output-json /tmp/pin-bump.json \
            --github-output "$GITHUB_OUTPUT"
          rm -rf /tmp/vllm-pin-ancestry /tmp/daily-cursor /tmp/daily-ls-remote.txt

      - name: Commit pin bump branch and open or update PR
        if: steps.prep.outputs.changed == 'true'
        env:
          SAIL_MAIN_SHA: ${{ steps.prep.outputs.sail_main_sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const meta = JSON.parse(fs.readFileSync("/tmp/pin-bump.json", "utf8"));
            if (String(meta.changed) !== "true") {
              return;
            }
            const { owner, repo } = context.repo;
            const branch = "ci/auto-pin-bump-vllm-main";
            const refName = `heads/${branch}`;
            const pinPath = ".github/vllm-main-verified.commit";
            const manifestPath = "csrc/upstream/manifest.toml";

            const preparedSailSha = String(
              meta.sail_base_sha || process.env.SAIL_MAIN_SHA || context.sha || ""
            ).trim();
            const mainRef = await github.rest.git.getRef({ owner, repo, ref: "heads/main" });
            const refMainSha = String(
              (mainRef && mainRef.data && mainRef.data.object && mainRef.data.object.sha) || ""
            ).trim();
            if (refMainSha && preparedSailSha && refMainSha !== preparedSailSha) {
              throw new Error(
                `Refusing to write pin bump prepared on ${preparedSailSha}: heads/main advanced to ${refMainSha}; next scheduled run will revalidate against live main.`
              );
            }
            const liveMainSha = refMainSha || preparedSailSha;
            if (github.rest.repos && typeof github.rest.repos.getContent === "function") {
              const pinContentRes = await github.rest.repos.getContent({
                owner,
                repo,
                path: pinPath,
                ref: liveMainSha,
              });
              const rawContent =
                pinContentRes && pinContentRes.data && pinContentRes.data.content;
              if (typeof rawContent === "string") {
                const livePin = Buffer.from(rawContent, "base64").toString("utf8").trim();
                if (
                  meta.previous_pin &&
                  livePin &&
                  livePin !== String(meta.previous_pin).trim()
                ) {
                  throw new Error(
                    `Refusing to write pin bump expecting previous_pin=${meta.previous_pin}: live ${pinPath} at ${liveMainSha} is ${livePin}.`
                  );
                }
              }
            }

            const baseCommit = await github.rest.git.getCommit({
              owner,
              repo,
              commit_sha: liveMainSha,
            });
            const pinBlob = await github.rest.git.createBlob({
              owner,
              repo,
              content: fs.readFileSync(pinPath, "utf8"),
              encoding: "utf-8",
            });
            const manifestBlob = await github.rest.git.createBlob({
              owner,
              repo,
              content: fs.readFileSync(manifestPath, "utf8"),
              encoding: "utf-8",
            });
            const newTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseCommit.data.tree.sha,
              tree: [
                { path: pinPath, mode: "100644", type: "blob", sha: pinBlob.data.sha },
                { path: manifestPath, mode: "100644", type: "blob", sha: manifestBlob.data.sha },
              ],
            });
            const newCommit = await github.rest.git.createCommit({
              owner,
              repo,
              message: `${meta.title}\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>`,
              tree: newTree.data.sha,
              parents: [liveMainSha],
            });

            try {
              await github.rest.git.getRef({ owner, repo, ref: refName });
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: refName,
                sha: newCommit.data.sha,
                force: true,
              });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/${refName}`,
                sha: newCommit.data.sha,
              });
            }

            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              base: "main",
            });

            if (openPrs.length > 0) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: openPrs[0].number,
                title: meta.title,
                body: meta.body,
              });
            } else {
              await github.rest.pulls.create({
                owner,
                repo,
                title: meta.title,
                head: branch,
                base: "main",
                body: meta.body,
              });
            }

  publish-and-triage:
    name: Publish allowlisted summary & dual-track triage
    if: always()
    needs:
      - route
      - build
      - cpu-fast-check
      - ppu-probe-smoke
      - rc-pin-ut
      - rc-fast-sanity
      - rc-model-sanity
      - rc-ops-select
      - rc-ops-tests
      - daily-pin-bump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Check out vLLM SAIL
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Discover latest published cursor artifact
        id: latest_cursor
        if: >-
          always() &&
          needs.route.result == 'success' &&
          needs.route.outputs.target_sha != '' &&
          (needs.route.outputs.selected_gear == 'probe' || needs.route.outputs.selected_gear == 'rc_qualify')
        env:
          ROUTE_PRIOR_CURSOR_ARTIFACT: ${{ needs.route.outputs.prior_cursor_artifact || '' }}
          SELECTED_GEAR: ${{ needs.route.outputs.selected_gear || 'probe' }}
          RUN_CPU: ${{ needs.route.outputs.run_cpu || 'false' }}
          RUN_PPU: ${{ needs.route.outputs.run_ppu || 'false' }}
          OPS_IMAGE: ${{ inputs.ops_image || '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const retryBaseMs = Number(process.env.CURSOR_DISCOVERY_RETRY_MS || 200);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            async function withRetry(label, fn, attempts = 3) {
              let lastErr;
              for (let i = 1; i <= attempts; i++) {
                try {
                  return await fn();
                } catch (err) {
                  lastErr = err;
                  if (i < attempts && retryBaseMs > 0) {
                    await sleep(retryBaseMs * i);
                  }
                }
              }
              throw new Error(
                `${label} failed after ${attempts} attempts: ${lastErr && lastErr.message ? lastErr.message : lastErr}`
              );
            }

            const perPage = 100;
            const nowMs = Date.now();
            const maxRunCreatedAgeMs = 65 * 24 * 60 * 60 * 1000;
            const maxRunUpdatedAgeMs = 32 * 24 * 60 * 60 * 1000;

            function isBetterCursor(cand, best) {
              if (!best) return true;
              if (cand.runId === best.runId && cand.attempt !== best.attempt) {
                return cand.attempt > best.attempt;
              }
              if (
                Number.isFinite(cand.createdMs) &&
                Number.isFinite(best.createdMs) &&
                cand.createdMs !== best.createdMs
              ) {
                return cand.createdMs > best.createdMs;
              }
              if (cand.id > 0 && best.id > 0 && cand.id !== best.id) {
                return cand.id > best.id;
              }
              if (cand.runId !== best.runId) {
                return cand.runId > best.runId;
              }
              return cand.attempt > best.attempt;
            }

            let best = null;
            async function scanRunCursorArtifacts(runId, maxExclusiveAttempt = 0) {
              let artPage = 1;
              let seenArts = 0;
              while (true) {
                const artsRes = await withRetry(
                  `listWorkflowRunArtifacts(run_id=${runId}, page=${artPage})`,
                  () =>
                    github.rest.actions.listWorkflowRunArtifacts({
                      owner,
                      repo,
                      run_id: runId,
                      per_page: 100,
                      page: artPage,
                    })
                );
                const artData = (artsRes && artsRes.data) || {};
                const artifacts = Array.isArray(artData.artifacts) ? artData.artifacts : [];
                for (const a of artifacts) {
                  if (!a || a.expired || typeof a.name !== "string") continue;
                  if (!a.name.startsWith("upstream-post-merge-cursor-")) continue;
                  const m = a.name.match(/-(\d+)$/);
                  const cand = {
                    runId,
                    name: a.name,
                    id: Number(a.id || 0),
                    attempt: Number((m && m[1]) || 0),
                    createdMs: a.created_at ? Date.parse(a.created_at) : NaN,
                  };
                  if (maxExclusiveAttempt > 0 && cand.attempt >= maxExclusiveAttempt) {
                    continue;
                  }
                  if (isBetterCursor(cand, best)) {
                    best = cand;
                  }
                }
                seenArts += artifacts.length;
                const totalArts = typeof artData.total_count === "number" ? artData.total_count : null;
                if (artifacts.length < 100 || (totalArts !== null && seenArts >= totalArts)) {
                  break;
                }
                artPage += 1;
              }
            }

            // Include this workflow run's own committed prior attempts when running a full rerun
            // (active runs have status="in_progress" and are omitted from status="completed").
            let scannedOwnRun = false;
            const inProgRes = await withRetry(
              "listWorkflowRuns(upstream-canary.yaml, in_progress)",
              () =>
                github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "upstream-canary.yaml",
                  branch: "main",
                  status: "in_progress",
                  per_page: perPage,
                  page: 1,
                })
            );
            const inProgRuns = Array.isArray(inProgRes && inProgRes.data && inProgRes.data.workflow_runs)
              ? inProgRes.data.workflow_runs
              : [];
            const selfActive = inProgRuns.find((r) => r && r.id === context.runId);
            if (selfActive) {
              scannedOwnRun = true;
              const ownAttempt = Number(
                process.env.GITHUB_RUN_ATTEMPT || context.runAttempt || selfActive.run_attempt || 0
              );
              await scanRunCursorArtifacts(selfActive.id, ownAttempt);
            }

            let page = 1;
            let seenRuns = 0;
            let reachedRetentionHorizon = false;
            while (!reachedRetentionHorizon) {
              const canaryRes = await withRetry(
                `listWorkflowRuns(upstream-canary.yaml, page=${page})`,
                () =>
                  github.rest.actions.listWorkflowRuns({
                    owner,
                    repo,
                    workflow_id: "upstream-canary.yaml",
                    branch: "main",
                    status: "completed",
                    per_page: perPage,
                    page,
                  })
              );
              const data = (canaryRes && canaryRes.data) || {};
              const runs = Array.isArray(data.workflow_runs) ? data.workflow_runs : [];
              if (runs.length === 0) break;

              for (const run of runs) {
                if (!run || typeof run.id !== "number") continue;
                if (run.id === context.runId) {
                  if (!scannedOwnRun) {
                    scannedOwnRun = true;
                    const ownAttempt = Number(
                      process.env.GITHUB_RUN_ATTEMPT || context.runAttempt || run.run_attempt || 0
                    );
                    await scanRunCursorArtifacts(run.id, ownAttempt);
                  }
                  continue;
                }

                const runCreatedMs = run.created_at ? Date.parse(run.created_at) : NaN;
                const runUpdatedMs = run.updated_at ? Date.parse(run.updated_at) : NaN;
                if (Number.isFinite(runCreatedMs) && nowMs - runCreatedMs > maxRunCreatedAgeMs) {
                  reachedRetentionHorizon = true;
                  break;
                }
                const latestTouchMs = Number.isFinite(runUpdatedMs) ? runUpdatedMs : runCreatedMs;
                if (Number.isFinite(latestTouchMs) && nowMs - latestTouchMs > maxRunUpdatedAgeMs) {
                  continue;
                }
                if (
                  best &&
                  Number.isFinite(best.createdMs) &&
                  run.run_attempt === 1 &&
                  Number.isFinite(runUpdatedMs) &&
                  runUpdatedMs + 60000 < best.createdMs
                ) {
                  continue;
                }

                await scanRunCursorArtifacts(run.id, 0);
              }

              seenRuns += runs.length;
              const totalRuns = typeof data.total_count === "number" ? data.total_count : null;
              if (runs.length < perPage || (totalRuns !== null && seenRuns >= totalRuns)) {
                break;
              }
              page += 1;
            }

            const routePrior = process.env.ROUTE_PRIOR_CURSOR_ARTIFACT || "";
            const observedOwnAttempt = Number((selfActive && selfActive.run_attempt) || 0);
            const effectiveAttempt = Number(
              process.env.GITHUB_RUN_ATTEMPT || context.runAttempt || observedOwnAttempt || 1
            );
            if (best && best.name !== routePrior) {
              // A committed earlier attempt of this run may already include an
              // external verdict. Keep that parent even on a publisher-only retry.
              if (effectiveAttempt > 1 && best.runId !== context.runId) {
                const isRc = process.env.SELECTED_GEAR === "rc_qualify";
                const runCpu = isRc || process.env.RUN_CPU === "true";
                const runPpu = isRc || process.env.RUN_PPU === "true";
                const required = new Set();
                if (runCpu || runPpu) required.add("Build candidate wheels & reuse SAIL .so");
                if (runCpu) required.add("SDK container CPU fast check & static bisect");
                if (isRc) {
                  required.add("RC PPU pin unit tests");
                  required.add("RC PPU recipe fast sanity");
                  required.add("RC PPU recipe model sanity");
                  if ((process.env.OPS_IMAGE || "").trim()) {
                    required.add("RC PPU operator test selection");
                    required.add("RC PPU operator qualification");
                  }
                } else if (runPpu) {
                  required.add("PPU 1-card sliding-window smoke & bisect");
                }
                const gateCount = required.size;
                // The build and CPU gate use route's exact target SHA. Rerunning
                // the CPU gate also reruns its dependent RC jobs and their matrices.
                for (let jobPage = 1; required.size; jobPage += 1) {
                  const { data } = await withRetry(
                    `listJobsForWorkflowRunAttempt(run_id=${context.runId}, attempt=${effectiveAttempt}, page=${jobPage})`,
                    () =>
                      github.rest.actions.listJobsForWorkflowRunAttempt({
                        owner,
                        repo,
                        run_id: context.runId,
                        attempt_number: effectiveAttempt,
                        per_page: perPage,
                        page: jobPage,
                      })
                  );
                  const jobs = Array.isArray(data && data.jobs) ? data.jobs : [];
                  for (const j of jobs) {
                    if (
                      !j || typeof j.name !== "string" || j.status !== "completed" ||
                      !["success", "failure"].includes(j.conclusion) ||
                      (j.run_attempt != null && Number(j.run_attempt) !== effectiveAttempt)
                    ) continue;
                    for (const gate of required) {
                      if (j.name === gate || j.name.startsWith(gate + " / ")) {
                        required.delete(gate);
                      }
                    }
                  }
                  if (jobs.length < perPage || jobPage * perPage >= data.total_count) break;
                }
                if (required.size) {
                  const reason = required.size === gateCount
                    ? "publisher-only retry (retested_lanes=0)"
                    : "partial retry (missing " + [...required].join(", ") + ")";
                  throw new Error(
                    `Refusing ${reason} in attempt ${effectiveAttempt} after newer cursor ${best.name}; dispatch a fresh workflow run for the target SHA.`
                  );
                }
              }
              core.setOutput("has_newer_external_cursor", "true");
              core.setOutput("latest_canary_run_id", String(best.runId));
              core.setOutput("latest_cursor_artifact", best.name);
            } else {
              core.setOutput("has_newer_external_cursor", "false");
              core.setOutput("latest_canary_run_id", "");
              core.setOutput("latest_cursor_artifact", "");
            }

      - name: Download latest committed cursor when superseded
        if: >-
          always() &&
          needs.route.result == 'success' &&
          steps.latest_cursor.outputs.has_newer_external_cursor == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.latest_cursor.outputs.latest_cursor_artifact }}
          run-id: ${{ steps.latest_cursor.outputs.latest_canary_run_id }}
          path: /tmp/post-merge-latest-cursor
          github-token: ${{ github.token }}

      - name: Download routing cursor artifact
        if: always() && needs.route.outputs.has_route_cursor == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.route.outputs.route_artifact_name }}
          path: /tmp/post-merge-meta

      - name: Download CPU metadata artifact
        if: always() && needs.cpu-fast-check.outputs.has_cpu_artifact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.cpu-fast-check.outputs.cpu_artifact_name }}
          path: /tmp/post-merge-meta

      - name: Download PPU bisection artifact
        if: always() && needs.ppu-probe-smoke.outputs.has_ppu_artifact == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ppu-probe-smoke.outputs.ppu_artifact_name }}
          path: /tmp/post-merge-meta

      - name: Render and mechanically verify public Console, Summary, Artifact, and Issue payloads
        id: publish
        env:
          SELECTED_GEAR: ${{ needs.route.outputs.selected_gear || 'probe' }}
          TARGET_SHA: ${{ needs.route.outputs.target_sha || '' }}
          RC_TAG: ${{ needs.route.outputs.rc_tag || '' }}
          RUN_CPU: ${{ needs.route.outputs.run_cpu || 'false' }}
          RUN_PPU: ${{ needs.route.outputs.run_ppu || 'false' }}
          PPU_SKIP_REASON: ${{ needs.route.outputs.ppu_skip_reason || 'none' }}
          HAS_ROUTE_CURSOR: ${{ needs.route.outputs.has_route_cursor || 'false' }}
          HAS_NEWER_EXTERNAL_CURSOR: ${{ steps.latest_cursor.outputs.has_newer_external_cursor || 'false' }}
          OPS_IMAGE: ${{ inputs.ops_image || '' }}
          BUILD_IMAGE: ${{ needs.build.outputs.image || '' }}
          ROUTE_RESULT: ${{ needs.route.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CPU_RESULT: ${{ needs.cpu-fast-check.result }}
          PPU_SMOKE_RESULT: ${{ needs.ppu-probe-smoke.result }}
          RC_PIN_RESULT: ${{ needs.rc-pin-ut.result }}
          RC_FAST_RESULT: ${{ needs.rc-fast-sanity.result }}
          RC_MODEL_RESULT: ${{ needs.rc-model-sanity.result }}
          RC_OPS_SELECT_RESULT: ${{ needs.rc-ops-select.result }}
          RC_OPS_RESULT: ${{ needs.rc-ops-tests.result }}
          BUMP_RESULT: ${{ needs.daily-pin-bump.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/post-merge-public
          if [[ "${HAS_NEWER_EXTERNAL_CURSOR}" == "true" && ! -f /tmp/post-merge-latest-cursor/cursor.json ]]; then
            echo "latest_cursor reported has_newer_external_cursor=true but /tmp/post-merge-latest-cursor/cursor.json is missing" >&2
            exit 1
          fi
          if [[ "${HAS_ROUTE_CURSOR}" == "true" && ! -f /tmp/post-merge-meta/cursor.json ]]; then
            echo "route reported has_route_cursor=true but /tmp/post-merge-meta/cursor.json is missing" >&2
            exit 1
          fi
          resolved_env="/tmp/post-merge-public/resolved-outcome.env"
          : > "${resolved_env}"
          python3 scripts/ci/ppu_upstream_post_merge.py resolve-outcome \
            --gear "${SELECTED_GEAR}" \
            --target-sha "${TARGET_SHA}" \
            --run-cpu "${RUN_CPU}" \
            --run-ppu "${RUN_PPU}" \
            --ppu-skip-reason "${PPU_SKIP_REASON}" \
            --ops-image "${OPS_IMAGE}" \
            --route-result "${ROUTE_RESULT}" \
            --build-result "${BUILD_RESULT}" \
            --cpu-result "${CPU_RESULT}" \
            --ppu-smoke-result "${PPU_SMOKE_RESULT}" \
            --rc-pin-result "${RC_PIN_RESULT}" \
            --rc-fast-result "${RC_FAST_RESULT}" \
            --rc-model-result "${RC_MODEL_RESULT}" \
            --rc-ops-select-result "${RC_OPS_SELECT_RESULT}" \
            --rc-ops-result "${RC_OPS_RESULT}" \
            --bump-result "${BUMP_RESULT}" \
            --github-output "${resolved_env}" >/dev/null
          # shellcheck disable=SC1090
          source "${resolved_env}"
          rm -f "${resolved_env}"

          extra_args=()
          if [[ "${HAS_NEWER_EXTERNAL_CURSOR}" == "true" ]]; then
            extra_args+=(--cursor-in /tmp/post-merge-latest-cursor/cursor.json)
            if [[ "${SELECTED_GEAR}" == "probe" ]]; then
              superseded_front="$(TARGET_SHA="${TARGET_SHA}" python3 - <<'PY'
          import json, os
          from pathlib import Path

          def _front(p: Path) -> str:
              if not p.is_file():
                  return ""
              data = json.loads(p.read_text(encoding="utf-8"))
              hist = data.get("probe_history") or []
              if hist and isinstance(hist[0], dict):
                  return str(hist[0].get("upstream_sha") or "").strip()
              rec = data.get("last_probe_record")
              if isinstance(rec, dict):
                  return str(rec.get("upstream_sha") or "").strip()
              return ""

          route_f = _front(Path("/tmp/post-merge-meta/cursor.json"))
          latest_f = _front(Path("/tmp/post-merge-latest-cursor/cursor.json"))
          target = os.environ.get("TARGET_SHA", "").strip()
          print("true" if (latest_f and latest_f != route_f and latest_f != target) else "false")
          PY
              )"
              if [[ "${superseded_front}" == "true" ]]; then
                extra_args+=(--superseded-probe-frontier)
              fi
            fi
          elif [[ -f /tmp/post-merge-meta/cursor.json ]]; then
            extra_args+=(--cursor-in /tmp/post-merge-meta/cursor.json)
          fi
          if [[ -f /tmp/post-merge-meta/cpu-result.json ]]; then
            extra_args+=(--cpu-result-json /tmp/post-merge-meta/cpu-result.json)
          fi
          if [[ -f /tmp/post-merge-meta/bisect-result.json ]]; then
            extra_args+=(--bisect-result-json /tmp/post-merge-meta/bisect-result.json)
          fi
          if [[ -f /tmp/post-merge-meta/non-ppu-repro.json ]]; then
            extra_args+=(--non-ppu-repro-json /tmp/post-merge-meta/non-ppu-repro.json)
          fi

          python3 scripts/ci/ppu_upstream_post_merge.py publish \
            --gear "${SELECTED_GEAR}" \
            --status "${status}" \
            --sail-sha "${GITHUB_SHA}" \
            --upstream-sha "${TARGET_SHA}" \
            --build-image "${BUILD_IMAGE}" \
            --rc-tag "${RC_TAG}" \
            --cpu-status "${cpu_status}" \
            --ppu-status "${ppu_status}" \
            --ppu-skip-reason "${ppu_skip_reason}" \
            --failure-stage "${failure_stage}" \
            --fetch-upstream-author \
            --run-url "${RUN_URL}" \
            --public-dir /tmp/post-merge-public \
            --step-summary "${GITHUB_STEP_SUMMARY}" \
            "${extra_args[@]}"
          final_st="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("/tmp/post-merge-public/public-summary.json").read_text(encoding="utf-8"))["status"])')"
          printf 'final_status=%s\n' "${final_st}" >> "$GITHUB_OUTPUT"

      - name: Upload allowlisted public summary artifact
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-post-merge-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/post-merge-public/public-summary.json
            /tmp/post-merge-public/issue-payload.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload persistent post-merge cursor artifact
        if: >-
          always() &&
          needs.route.result == 'success' &&
          needs.route.outputs.target_sha != '' &&
          (steps.latest_cursor.outcome == 'success' || steps.latest_cursor.outcome == 'skipped') &&
          steps.publish.outcome == 'success' &&
          (needs.route.outputs.selected_gear == 'probe' || needs.route.outputs.selected_gear == 'rc_qualify') &&
          steps.publish.outputs.final_status != 'noop'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-post-merge-cursor-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/post-merge-public/cursor.json
          if-no-files-found: error
          retention-days: 30

      - name: Open or update bucketed vllm-sail issue for internal patch drift
        if: always() && steps.publish.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const payloadPath = "/tmp/post-merge-public/issue-payload.json";
            if (!fs.existsSync(payloadPath)) return;
            const payload = JSON.parse(fs.readFileSync(payloadPath, "utf8"));
            if (payload.should_file_upstream_issue) {
              throw new Error("CI must never auto-file cross-repo upstream issues");
            }
            if (!payload.should_file_sail_issue || !payload.title || !payload.body) return;

            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(item => !item.pull_request && item.title === payload.title);
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body: payload.body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: payload.title,
                body: payload.body,
              });
            }

      - name: Fail workflow when compatibility regression or infra error occurred
        if: always()
        env:
          FINAL_STATUS: ${{ steps.publish.outputs.final_status }}
        run: |
          case "${FINAL_STATUS}" in
            pass|skipped|deferred|noop) exit 0 ;;
            *) exit 1 ;;
          esac
