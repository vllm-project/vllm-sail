name: Nightly wheels
run-name: Benchmark upstream wheel reuse against run 45320243205

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Source branch to build; run the workflow itself from main
        type: string
        required: true
        default: main

permissions:
  contents: read
  actions: read
cache-mode: none

concurrency:
  group: nightly-wheels-${{ inputs.branch || 'main' }}
  cancel-in-progress: false
  queue: max

jobs:
  warm:
    name: PPU wheel build with upstream reuse
    if: github.repository == 'vllm-project/vllm-sail' && github.ref_name == 'ci/benchmark-upstream-vllm-wheel'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: download.t-head.cn/docker_release/pytorch@sha256:a33a67832f7ec442c481421e94255518dd67e464406f8e610c15d2b594b21f80
    env:
      VLLM_SAIL_BUILD_IMAGE: download.t-head.cn/docker_release/pytorch@sha256:a33a67832f7ec442c481421e94255518dd67e464406f8e610c15d2b594b21f80
      PYTORCH_SAIL_ARCH: ppu_15;ppu_10
      ARTIFACT_DIR: ${{ github.workspace }}/artifacts
    steps:
      - name: Disable internal GitHub mirror rewrite
        shell: bash
        run: |
          for scope in system global; do
            while IFS= read -r key; do
              git config --${scope} --unset-all "${key}" 2>/dev/null || true
            done < <(git config --${scope} --get-regexp '^url\..*\.insteadof$' | awk '$2 ~ /github\.com/ {print $1}')
          done
      - name: Require disabled cache access
        uses: actions/github-script@v7
        with:
          script: |
            if (process.env.ACTIONS_CACHE_MODE !== 'none') {
              core.setFailed('PPU CI requires cache-mode: none');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Download the cold build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '14889457834'
          run-id: '45320243205'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/benchmark-donors/3
      - name: Build or repackage wheels
        shell: bash
        env:
          DONOR_SHA: bedba1222e6b5a65a38e88cf4d0fb9f1383e8ffa
          VLLM_SAIL_NATIVE_REUSE_ROOT: ${{ runner.temp }}/benchmark-donors
        run: |
          set -x
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$DONOR_SHA" > "$VLLM_SAIL_NATIVE_REUSE_ROOT/3.source"
          bash scripts/ci/build_ppu_wheels.sh
      - name: Verify the Rust wheel was reused and SAIL was rebuilt
        shell: bash
        env:
          VLLM_SAIL_NATIVE_REUSE_ROOT: ${{ runner.temp }}/benchmark-donors
        run: |
          grep -Fxq 'reuse_mode=vllm-only' "$ARTIFACT_DIR/build-manifest.txt"
          test ! -e "$ARTIFACT_DIR/logs/vllm-rust-build.log"
          grep -Fq -- ' --parallel ' "$ARTIFACT_DIR/logs/vllm-sail-build.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          donor_root = Path(os.environ["VLLM_SAIL_NATIVE_REUSE_ROOT"])
          donor = json.loads((donor_root / "3/wheel-manifest.json").read_text())
          result_root = Path(os.environ["ARTIFACT_DIR"])
          result = json.loads((result_root / "wheels/wheel-manifest.json").read_text())
          assert donor["wheels"]["vllm"] == result["wheels"]["vllm"]
          assert donor["vllm_build_fingerprint"] == result["vllm_build_fingerprint"]
          assert donor["commits"]["vllm"] == result["commits"]["vllm"]
          assert result["commits"]["vllm-sail"] == os.environ["GITHUB_SHA"]
          assert donor["native_reuse"]["fingerprint"] != result["native_reuse"]["fingerprint"]
          print("The upstream wheel SHA256 is identical. The SAIL wheel was rebuilt for this commit.")
          PY
      - name: Upload reuse benchmark wheels
        uses: actions/upload-artifact@v4
        with:
          name: ppu-wheels-upstream-only-${{ github.run_id }}
          path: artifacts/wheels/
          if-no-files-found: error
          retention-days: 3
      - name: Upload reuse build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppu-build-diagnostics-upstream-only-${{ github.run_id }}
          path: |
            artifacts/logs/**
            artifacts/build-manifest.txt
          retention-days: 3
